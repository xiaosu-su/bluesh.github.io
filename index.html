<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼓励话语 - 正能量满满</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .message-item {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            font-size: 20px;
            font-weight: 600;
            color: #333;
            text-align: center;
            max-width: 280px;
            word-wrap: break-word;
            line-height: 1.5;
            border: 3px solid rgba(102, 126, 234, 0.3);
        }

        .message-item::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 15px;
            z-index: -1;
            opacity: 0;
            animation: borderGlow 2s ease infinite;
        }

        /* 多种弹窗动画效果 */
        @keyframes popupScale {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideFromRight {
            0% {
                opacity: 0;
                transform: translateX(200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideFromTop {
            0% {
                opacity: 0;
                transform: translateY(-200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideFromBottom {
            0% {
                opacity: 0;
                transform: translateY(200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes rotateIn {
            0% {
                opacity: 0;
                transform: rotate(-180deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0.3);
            }
            50% {
                transform: translateY(-30px) scale(1.1);
            }
            70% {
                transform: translateY(10px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes zoomFlip {
            0% {
                opacity: 0;
                transform: scale(0.5) rotateY(90deg);
            }
            50% {
                transform: scale(1.1) rotateY(0deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        @keyframes elasticPop {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }
            40% {
                transform: scale(1.3);
            }
            60% {
                transform: scale(0.9);
            }
            80% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeZoom {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(10deg);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1) rotate(-5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes spinIn {
            0% {
                opacity: 0;
                transform: rotate(360deg) scale(0.3);
            }
            100% {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes swingIn {
            0% {
                opacity: 0;
                transform: rotate(-30deg) translateX(-100px) scale(0.7);
            }
            50% {
                transform: rotate(10deg) translateX(10px) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: rotate(0deg) translateX(0) scale(1);
            }
        }

        @keyframes pulseIn {
            0% {
                opacity: 0;
                transform: scale(0.4);
            }
            30% {
                opacity: 0.7;
                transform: scale(1.2);
            }
            50% {
                transform: scale(0.95);
            }
            70% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes borderGlow {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
        }

        .message-item::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 15px;
            z-index: -1;
            opacity: 0;
            animation: borderGlow 2s ease infinite;
        }

        .emoji {
            font-size: 28px;
            margin-right: 10px;
            display: inline-block;
            animation: rotateEmoji 3s ease infinite;
        }

        @keyframes rotateEmoji {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(10deg) scale(1.1);
            }
        }

        /* 消息持续动画 - 使用margin避免与transform冲突 */
        @keyframes float {
            0%, 100% {
                margin-top: 0px;
            }
            50% {
                margin-top: -8px;
            }
        }

        @keyframes shake {
            0%, 100% {
                margin-left: 0px;
            }
            25% {
                margin-left: -3px;
            }
            75% {
                margin-left: 3px;
            }
        }

        /* 持续动画类 */
        .float-animation {
            animation: float 3s ease-in-out infinite !important;
        }

        .shake-animation {
            animation: shake 2s ease-in-out infinite !important;
        }

        /* 移动到心形的动画 - 使用transition更流畅 */
        .move-to-heart {
            transition: left 2s ease-in-out, top 2s ease-in-out !important;
        }

        /* 音乐控制按钮样式 */
        .music-control-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid rgba(102, 126, 234, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            z-index: 1000;
            user-select: none;
        }

        .music-control-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 1);
            border-color: rgba(102, 126, 234, 0.8);
        }

        .music-control-btn:active {
            transform: scale(0.95);
        }

        .music-control-btn .icon {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        .music-control-btn.playing .icon {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>

            { name: 'popupScale', duration: '1.2s', timing: 'ease-out' },
            { name: 'slideFromLeft', duration: '1.0s', timing: 'ease-out' },

        // 持续动画效果（弹出后的持续动画）
        const continuousAnimations = [
            { name: 'float', duration: '3s', timing: 'ease-in-out' },
            { name: 'shake', duration: '2s', timing: 'ease-in-out' }
        ];

        const container = document.getElementById('messages-container');
        let messageIndex = 0;
        let usedPositions = new Set();
        let heartMode = false;
        let messages = [];
        
        // 心形路径生成函数
        function getHeartPosition(angle, index, total) {
            // 心形参数方程 - 角度从0到2π
            const scale = Math.min(window.innerWidth, window.innerHeight) * 0.35;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2 + 20; // 稍微下移一点
            
            // 使用心形数学公式：x = 16sin³(t), y = -(13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t))
            const t = angle;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            // 缩放和平移（除以16是为了归一化）
            return {
                x: centerX + (x * scale / 16) - 140, // 减去消息宽度的一半
                y: centerY + (y * scale / 16) - 40    // 减去消息高度的一半
            };
        }

        // 生成随机位置，避免重叠
        function getRandomPosition() {
            const maxAttempts = 50;
            let attempts = 0;
            
            while (attempts < maxAttempts) {
                const x = Math.random() * (window.innerWidth - 320);
                const y = Math.random() * (window.innerHeight - 100);
                
                // 检查是否与已有位置太近（至少120px距离，让消息更密集）
                let tooClose = false;
                for (const pos of usedPositions) {
                    const [px, py] = pos.split(',').map(Number);
                    const distance = Math.sqrt(Math.pow(x - px, 2) + Math.pow(y - py, 2));
                    if (distance < 140) {
                        tooClose = true;
                        break;
                    }
                }
                
                if (!tooClose) {
                    usedPositions.add(`${x},${y}`);
                    return { x, y };
                }
                
                attempts++;
            }
            
            // 如果找不到合适位置，返回随机位置
            const x = Math.random() * (window.innerWidth - 300);
            const y = Math.random() * (window.innerHeight - 100);
            usedPositions.add(`${x},${y}`);
            return { x, y };
        }

        function createMessage() {
            if (messageIndex >= encouragements.length) {
                messageIndex = 0; // 循环显示
            }

            const message = encouragements[messageIndex];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const position = getRandomPosition();
            
            // 随机选择弹出动画
            const popupAnimation = animations[Math.floor(Math.random() * animations.length)];
            // 随机选择持续动画（可选）
            const continuousAnimation = Math.random() > 0.7 ? continuousAnimations[Math.floor(Math.random() * continuousAnimations.length)] : null;

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-item';
            messageDiv.style.left = position.x + 'px';
            messageDiv.style.top = position.y + 'px';
            
            // 设置弹出动画
            messageDiv.style.opacity = '0';
            const delay = (messageIndex * 0.05);
            messageDiv.style.animation = `${popupAnimation.name} ${popupAnimation.duration} ${popupAnimation.timing} forwards`;
            messageDiv.style.animationDelay = delay + 's';
            
            // 如果选择持续动画，在弹出动画完成后添加
            if (continuousAnimation) {
                const popupDurationMs = parseFloat(popupAnimation.duration) * 1000;
                setTimeout(() => {
                    if (!heartMode) {
                        messageDiv.classList.add(continuousAnimation.name + '-animation');
                    }
                }, popupDurationMs + delay * 1000);
            }
            
            // 每条消息前加上"颖，"
            messageDiv.innerHTML = `<span class="emoji">${emoji}</span>颖，${message}`;

            container.appendChild(messageDiv);
            messages.push(messageDiv);

            messageIndex++;
        }
        
        // 将所有消息移动到心形
        function arrangeInHeart() {
            heartMode = true;
            const total = messages.length;
            const startDelay = 500; // 延迟500ms后开始移动
            
            messages.forEach((msg, index) => {
                setTimeout(() => {
                    // 计算心形上的位置（角度从0到2π均匀分布）
                    const angle = (index / total) * 2 * Math.PI;
                    const heartPos = getHeartPosition(angle, index, total);
                    
                    // 先添加过渡类
                    msg.classList.add('move-to-heart');
                    
                    // 然后更新位置，触发transition动画
                    setTimeout(() => {
                        msg.style.left = heartPos.x + 'px';
                        msg.style.top = heartPos.y + 'px';
                    }, 10);
                    
                }, startDelay + index * 30); // 每个消息间隔30ms，形成波浪效果
            });
        }

        // 播放背景音乐（仅在用户交互后调用）
        function playBackgroundMusic() {
            const music = document.getElementById('background-music');
            if (music && music.paused) {
                music.volume = 0.5; // 设置音量为50%
                
                // 使用 Promise 处理播放，避免竞态条件
                const playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            // 播放成功
                            console.log('音乐播放成功');
                        })
                        .catch(error => {
                            // 播放失败（通常是浏览器策略限制）
                            console.log('音乐播放需要用户交互:', error);
                        });
                }
            }
        }

        // 初始化音乐控制按钮
        function initMusicControl() {
            const musicBtn = document.getElementById('music-control-btn');
            const music = document.getElementById('background-music');
            const icon = musicBtn.querySelector('.icon');
            
            if (!musicBtn || !music) return;
            
            // 设置初始音量
            music.volume = 0.5;
            
            // 检查音频是否加载成功
            music.addEventListener('error', function(e) {
                console.error('音频加载失败:', e);
                console.log('提示: 请确保 music.mp3 文件在仓库根目录');
            });
            
            music.addEventListener('canplay', function() {
                console.log('音频加载成功，可以播放');
            });
            
            // 更新按钮状态
            function updateButtonState() {
                if (music.paused) {
                    musicBtn.classList.remove('playing');
                    icon.textContent = '🎵';
                    musicBtn.title = '播放音乐';
                } else {
                    musicBtn.classList.add('playing');
                    icon.textContent = '⏸️';
                    musicBtn.title = '暂停音乐';
                }
            }
            
            // 按钮点击事件 - 使用标志避免重复点击
            let isPlaying = false;
            musicBtn.addEventListener('click', function() {
                if (isPlaying) return; // 防止重复点击
                
                if (music.paused) {
                    isPlaying = true;
                    // 尝试播放
                    const playPromise = music.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                // 播放成功
                                isPlaying = false;
                                updateButtonState();
                            })
                            .catch(error => {
                                // 播放失败
                                isPlaying = false;
                                console.log('播放失败:', error);
                                updateButtonState();
                            });
                    } else {
                        isPlaying = false;
                        updateButtonState();
                    }
                } else {
                    // 暂停音乐
                    music.pause();
                    updateButtonState();
                }
            });
            
            // 监听音乐播放状态变化（自动更新按钮状态）
            music.addEventListener('play', function() {
                updateButtonState();
            });
            
            music.addEventListener('pause', function() {
                updateButtonState();
            });
            
            // 监听播放结束（避免状态不同步）
            music.addEventListener('ended', function() {
                updateButtonState();
            });
            
            // 初始状态
            updateButtonState();
        }

        // 页面加载后开始自动弹出
        window.addEventListener('load', function() {
            // 初始化音乐控制按钮（不自动播放，等待用户点击）
            initMusicControl();
            
            // 创建固定数量的消息来组成心形（建议50-100条）
            const heartMessageCount = 80;
            let createdCount = 0;
            
            // 创建消息的函数
            function createBatch() {
                if (createdCount < heartMessageCount) {
                    createMessage();
                    createdCount++;
                    
                    // 继续创建
                    setTimeout(createBatch, 100);
                } else {
                    // 所有消息创建完成后，延迟3秒开始组成心形
                    setTimeout(() => {
                        arrangeInHeart();
                    }, 3000);
                }
            }
            
            // 开始创建消息
            createBatch();
        });

        // 用户点击页面后播放音乐（解决浏览器自动播放限制）
        // 注意：现在完全由音乐按钮控制，移除了自动播放逻辑
        // 用户需要点击音乐按钮来播放/暂停音乐

        // 窗口大小改变时清理位置记录
        window.addEventListener('resize', function() {
            usedPositions.clear();
        });
    </script>
</body>
</html>
