<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼓励话语 - 正能量满满</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 音乐控制面板 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            min-width: 200px;
        }

        .music-control h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #667eea;
            text-align: center;
        }

        .music-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .music-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .music-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }

        .music-btn:active {
            transform: translateY(0);
        }

        .music-btn.active {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .music-source {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .source-btn {
            flex: 1;
            padding: 8px 10px;
            border: 2px solid #667eea;
            border-radius: 6px;
            background: white;
            color: #667eea;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .source-btn:hover {
            background: #f0f0ff;
        }

        .source-btn.active {
            background: #667eea;
            color: white;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            text-align: center;
            word-break: break-all;
        }

        .message-item {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            font-size: 20px;
            font-weight: 600;
            color: #333;
            text-align: center;
            max-width: 280px;
            word-wrap: break-word;
            line-height: 1.5;
            border: 3px solid rgba(102, 126, 234, 0.3);
        }

        .message-item::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 15px;
            z-index: -1;
            opacity: 0;
            animation: borderGlow 2s ease infinite;
        }

        /* 多种弹窗动画效果 */
        @keyframes popupScale {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideFromRight {
            0% {
                opacity: 0;
                transform: translateX(200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideFromTop {
            0% {
                opacity: 0;
                transform: translateY(-200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideFromBottom {
            0% {
                opacity: 0;
                transform: translateY(200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes rotateIn {
            0% {
                opacity: 0;
                transform: rotate(-180deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0.3);
            }
            50% {
                transform: translateY(-30px) scale(1.1);
            }
            70% {
                transform: translateY(10px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes zoomFlip {
            0% {
                opacity: 0;
                transform: scale(0.5) rotateY(90deg);
            }
            50% {
                transform: scale(1.1) rotateY(0deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        @keyframes elasticPop {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }
            40% {
                transform: scale(1.3);
            }
            60% {
                transform: scale(0.9);
            }
            80% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeZoom {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(10deg);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1) rotate(-5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes spinIn {
            0% {
                opacity: 0;
                transform: rotate(360deg) scale(0.3);
            }
            100% {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes swingIn {
            0% {
                opacity: 0;
                transform: rotate(-30deg) translateX(-100px) scale(0.7);
            }
            50% {
                transform: rotate(10deg) translateX(10px) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: rotate(0deg) translateX(0) scale(1);
            }
        }

        @keyframes pulseIn {
            0% {
                opacity: 0;
                transform: scale(0.4);
            }
            30% {
                opacity: 0.7;
                transform: scale(1.2);
            }
            50% {
                transform: scale(0.95);
            }
            70% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes borderGlow {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.6;
            }
        }

        .message-item::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 15px;
            z-index: -1;
            opacity: 0;
            animation: borderGlow 2s ease infinite;
        }

        .emoji {
            font-size: 28px;
            margin-right: 10px;
            display: inline-block;
            animation: rotateEmoji 3s ease infinite;
        }

        @keyframes rotateEmoji {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(10deg) scale(1.1);
            }
        }

        /* 消息持续动画 - 使用margin避免与transform冲突 */
        @keyframes float {
            0%, 100% {
                margin-top: 0px;
            }
            50% {
                margin-top: -8px;
            }
        }

        @keyframes shake {
            0%, 100% {
                margin-left: 0px;
            }
            25% {
                margin-left: -3px;
            }
            75% {
                margin-left: 3px;
            }
        }

        /* 持续动画类 */
        .float-animation {
            animation: float 3s ease-in-out infinite !important;
        }

        .shake-animation {
            animation: shake 2s ease-in-out infinite !important;
        }

        /* 移动到心形的动画 - 使用transition更流畅 */
        .move-to-heart {
            transition: left 2s ease-in-out, top 2s ease-in-out !important;
        }
    </style>
</head>

        // 心形路径生成函数
        function getHeartPosition(angle, index, total) {
            // 心形参数方程 - 角度从0到2π
            const scale = Math.min(window.innerWidth, window.innerHeight) * 0.35;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2 + 20; // 稍微下移一点
            
            // 使用心形数学公式：x = 16sin³(t), y = -(13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t))
            const t = angle;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            // 缩放和平移（除以16是为了归一化）
            return {
                x: centerX + (x * scale / 16) - 140, // 减去消息宽度的一半
                y: centerY + (y * scale / 16) - 40    // 减去消息高度的一半
            };
        }

        // 生成随机位置，避免重叠
        function getRandomPosition() {
            const maxAttempts = 50;
            let attempts = 0;
            
            while (attempts < maxAttempts) {
                const x = Math.random() * (window.innerWidth - 320);
                const y = Math.random() * (window.innerHeight - 100);
                
                // 检查是否与已有位置太近（至少120px距离，让消息更密集）
                let tooClose = false;
                for (const pos of usedPositions) {
                    const [px, py] = pos.split(',').map(Number);
                    const distance = Math.sqrt(Math.pow(x - px, 2) + Math.pow(y - py, 2));
                    if (distance < 140) {
                        tooClose = true;
                        break;
                    }
                }
                
                if (!tooClose) {
                    usedPositions.add(`${x},${y}`);
                    return { x, y };
                }
                
                attempts++;
            }
            
            // 如果找不到合适位置，返回随机位置
            const x = Math.random() * (window.innerWidth - 300);
            const y = Math.random() * (window.innerHeight - 100);
            usedPositions.add(`${x},${y}`);
            return { x, y };
        }

        function createMessage() {
            if (messageIndex >= encouragements.length) {
                messageIndex = 0; // 循环显示
            }

            const message = encouragements[messageIndex];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const position = getRandomPosition();
            
            // 随机选择弹出动画
            const popupAnimation = animations[Math.floor(Math.random() * animations.length)];
            // 随机选择持续动画（可选）
            const continuousAnimation = Math.random() > 0.7 ? continuousAnimations[Math.floor(Math.random() * continuousAnimations.length)] : null;

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-item';
            messageDiv.style.left = position.x + 'px';
            messageDiv.style.top = position.y + 'px';
            
            // 设置弹出动画
            messageDiv.style.opacity = '0';
            const delay = (messageIndex * 0.05);
            messageDiv.style.animation = `${popupAnimation.name} ${popupAnimation.duration} ${popupAnimation.timing} forwards`;
            messageDiv.style.animationDelay = delay + 's';
            
            // 如果选择持续动画，在弹出动画完成后添加
            if (continuousAnimation) {
                const popupDurationMs = parseFloat(popupAnimation.duration) * 1000;
                setTimeout(() => {
                    if (!heartMode) {
                        messageDiv.classList.add(continuousAnimation.name + '-animation');
                    }
                }, popupDurationMs + delay * 1000);
            }
            
            // 每条消息前加上"颖，"
            messageDiv.innerHTML = `<span class="emoji">${emoji}</span>颖，${message}`;

            container.appendChild(messageDiv);
            messages.push(messageDiv);

            messageIndex++;
        }
        
        // 将所有消息移动到心形

                setTimeout(() => {
                    // 计算心形上的位置（角度从0到2π均匀分布）
                    const angle = (index / total) * 2 * Math.PI;
                    const heartPos = getHeartPosition(angle, index, total);
                    
                    // 先添加过渡类
                    msg.classList.add('move-to-heart');
                    
                    // 然后更新位置，触发transition动画
                    setTimeout(() => {
                        msg.style.left = heartPos.x + 'px';
                        msg.style.top = heartPos.y + 'px';
                    }, 10);
                    
                }, startDelay + index * 30); // 每个消息间隔30ms，形成波浪效果
            });
        }

        // 音乐控制变量
        let musicSource = 'repo'; // 'repo' 或 'local'
        let localMusicFile = null;

        // 初始化音乐控制
        const music = document.getElementById('background-music');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const repoBtn = document.getElementById('repoBtn');
        const localBtn = document.getElementById('localBtn');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');

        // 设置音乐音量
        if (music) {
            music.volume = 0.5;
        }

        // 播放按钮
        playBtn.addEventListener('click', function() {
            playMusic();
        });

        // 暂停按钮
        pauseBtn.addEventListener('click', function() {
            pauseMusic();
        });

        // 仓库播放按钮
        repoBtn.addEventListener('click', function() {
            musicSource = 'repo';
            repoBtn.classList.add('active');
            localBtn.classList.remove('active');
            fileInfo.textContent = '';
            
            // 加载仓库音乐
            loadRepoMusic();
        });

        // 本地播放按钮
        localBtn.addEventListener('click', function() {
            musicSource = 'local';
            localBtn.classList.add('active');
            repoBtn.classList.remove('active');
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                localMusicFile = file;
                loadLocalMusic(file);
            }
        });

        // 加载仓库音乐
        function loadRepoMusic() {
            if (!music) return;
            
            // 尝试多个仓库链接（优先使用 assets/Music/music.mp3）
            const repoUrls = [
                'https://raw.githubusercontent.com/xiaosu-su/bluesh.github.io/main/assets/Music/music.mp3',
                'https://raw.githubusercontent.com/xiaosu-su/bluesh.github.io/main/assets/Music/Music.mp3',
                'https://raw.githubusercontent.com/xiaosu-su/bluesh.github.io/master/assets/Music/music.mp3',
                'https://raw.githubusercontent.com/xiaosu-su/bluesh.github.io/master/assets/Music/Music.mp3',
                './assets/Music/music.mp3',
                './assets/Music/Music.mp3',
                'assets/Music/music.mp3',
                'assets/Music/Music.mp3',
                '/assets/Music/music.mp3',
                '/assets/Music/Music.mp3'
            ];
            
            let currentIndex = 0;
            
            function tryLoadUrl(index) {
                if (index >= repoUrls.length) {
                    fileInfo.textContent = '❌ 无法加载仓库音乐';
                    return;
                }
                
                music.src = repoUrls[index];
                music.load();
                
                music.addEventListener('error', function onError() {
                    music.removeEventListener('error', onError);
                    tryLoadUrl(index + 1);
                }, { once: true });
                
                music.addEventListener('canplay', function onCanPlay() {
                    music.removeEventListener('canplay', onCanPlay);
                    fileInfo.textContent = '✅ 已加载仓库音乐';
                }, { once: true });
            }
            
            tryLoadUrl(0);
        }

        // 加载本地音乐
        function loadLocalMusic(file) {
            if (!music || !file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                music.src = e.target.result;
                music.load();
                fileInfo.textContent = `✅ 已加载: ${file.name}`;
            };
            reader.onerror = function() {
                fileInfo.textContent = '❌ 文件读取失败';
            };
            reader.readAsDataURL(file);
        }

        // 播放音乐
        function playMusic() {
            if (!music || !music.src) {
                if (musicSource === 'repo') {
                    loadRepoMusic();
                } else {
                    fileInfo.textContent = '⚠️ 请先选择本地音乐文件';
                    return;
                }
            }
            
            music.play().then(() => {
                playBtn.style.display = 'none';
                pauseBtn.style.display = 'block';
                if (musicSource === 'repo') {
                    fileInfo.textContent = '🎵 正在播放：仓库音乐';
                } else {
                    fileInfo.textContent = `🎵 正在播放：${localMusicFile?.name || '本地音乐'}`;
                }
            }).catch(error => {
                console.error('播放失败:', error);
                fileInfo.textContent = '❌ 播放失败，请检查文件';
            });
        }

        // 暂停音乐
        function pauseMusic() {
            if (music) {
                music.pause();
                playBtn.style.display = 'block';
                pauseBtn.style.display = 'none';
                fileInfo.textContent = '⏸️ 已暂停';
            }
        }

        // 音乐播放结束事件
        if (music) {
            music.addEventListener('ended', function() {
                playBtn.style.display = 'block';
                pauseBtn.style.display = 'none';
            });
        }

        // 初始化加载仓库音乐
        loadRepoMusic();

        // 页面加载后开始自动弹出
        window.addEventListener('load', function() {
            // 创建固定数量的消息来组成心形（建议50-100条）
            const heartMessageCount = 80;
            let createdCount = 0;
            
            // 创建消息的函数
            function createBatch() {
                if (createdCount < heartMessageCount) {
                    createMessage();
                    createdCount++;
                    
                    // 继续创建
                    setTimeout(createBatch, 100);
                } else {
                    // 所有消息创建完成后，延迟3秒开始组成心形
                    setTimeout(() => {
                        arrangeInHeart();
                    }, 3000);
                }
            }
            
            // 开始创建消息
            createBatch();
        });


        // 窗口大小改变时清理位置记录
        window.addEventListener('resize', function() {
            usedPositions.clear();
        });
    </script>
</body>
</html>
